name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request and flag issues in these categories (skip any that don't apply):

            **Excess copy**: Duplicated logic, redundant abstractions, copy-pasted code blocks, or unnecessary boilerplate that should be extracted or removed.

            **Bugs**: Logic errors, off-by-ones, unhandled edge cases, incorrect assumptions, race conditions, or anything that will produce wrong behavior at runtime.

            **Security flaws**: Injection vulnerabilities (SQL, command, XSS), improper auth/authz, secrets in code, insecure defaults, or OWASP Top 10 issues.

            **Antipatterns**: Framework misuse, poor state management, inappropriate coupling, violation of SOLID principles, or patterns that will cause maintenance pain.

            **Code quality**: Unclear naming, missing or misleading types, dead code, overly complex functions, insufficient test coverage for changed logic.

            Requirements:
            - Use CLAUDE.md / AGENTS.md for project conventions.
            - Be brief and direct — only call out real issues, not stylistic preferences.
            - Use conventional commit spec for commit messages and PR titles.
            - Use `gh pr comment` with your Bash tool to post your review on the PR.
            - Enumerate every individual issue with a unique sequential ID so reviewers can reference items back to you. Use A, B, C, … Z, then AA, AB, … AZ, then BA, BB, and so on. IDs are global across all categories (do not restart per section). Format each item as `**[A]** <issue>` — bold, in brackets, at the start of the line.

          claude_args: |
            --max-turns 25
            --model claude-opus-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
