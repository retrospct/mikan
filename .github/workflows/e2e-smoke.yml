name: Desktop E2E smoke

# Deterministic, no-human tier of our GUI runbooks: builds the Electron app and
# runs the Playwright `_electron` smoke suite (CSP + local fonts + capture-file)
# headlessly under Xvfb. This is the half of "follow the runbook" that needs no
# agent and no judgement — it just passes or fails on every PR.
#
# The visual/judgement half (screenshots + demo video) is handled separately by
# a Cursor Automation that launches a cloud agent on PR events; see
# docs/testing/automation-setup.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contract/**'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/contract/**'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Skip the ONNX/MiniLM model download — the smoke suite never needs the
      # real embedder, and the network fetch is slow + flaky in CI.
      NEEME_EMBEDDER: hash
      NEEME_EXTRACTOR: off
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Root cause of the recurring `electron.launch: ENOENT ... path.txt`:
        # pnpm's side-effects cache (amplified by actions/setup-node `cache: pnpm`)
        # restores electron's package from the store WITHOUT its extracted dist/ +
        # path.txt and treats the build as already done, so electron's postinstall
        # never runs and the binary is never materialized. This regressed with the
        # Node 24 / pnpm 10 (action v6) bump. Disabling the side-effects cache for
        # this install forces electron's postinstall to actually run and download.
        run: |
          echo "side-effects-cache=false" >> .npmrc
          pnpm install --frozen-lockfile

      - name: Ensure Electron binary is present
        # electron's own postinstall (install.js → extract-zip) is broken under
        # Node 24: the download is fine (checksum-validated) but extract-zip writes
        # an almost-empty dist/ (only `locales/`, no `electron` binary, no
        # path.txt), so Playwright's `_electron` dies with `ENOENT ... path.txt`.
        # Bypass the broken extractor entirely: fetch the official release zip and
        # unzip it with the system `unzip`, then write path.txt ourselves. Finally
        # assert require('electron') resolves so any regression fails here, loudly.
        run: |
          electron_dir="$(node -e "console.log(require('path').dirname(require.resolve('electron/package.json')))")"
          ver="$(node -e "console.log(require('$electron_dir/package.json').version)")"
          url="https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          echo "electron package: $electron_dir (v$ver)"
          echo "fetching $url"
          sudo apt-get install -y --no-install-recommends unzip >/dev/null
          curl -fL --retry 3 --retry-all-errors -o /tmp/electron.zip "$url"
          rm -rf "$electron_dir/dist"
          mkdir -p "$electron_dir/dist"
          unzip -q -o /tmp/electron.zip -d "$electron_dir/dist"
          chmod +x "$electron_dir/dist/electron"
          printf 'electron' > "$electron_dir/path.txt"
          echo "--- dist/ ---"; ls "$electron_dir/dist" | head
          node -e "console.log('electron binary resolved at:', require('electron'))"

      - name: Install Electron/Chromium system libraries + Xvfb
        # Electron shares Chromium's shared-library set; `playwright install-deps
        # chromium` resolves the right apt packages across Ubuntu versions so we
        # don't hand-maintain a brittle libnss3/libgbm1/... list.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm --filter @nimi/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: pnpm --filter @nimi/desktop build

      - name: Run Electron E2E smoke (Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" pnpm --filter @nimi/desktop test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore
