name: Desktop E2E smoke

# Deterministic, no-human tier of our GUI runbooks: builds the Electron app and
# runs the Playwright `_electron` smoke suite (CSP + local fonts + capture-file)
# headlessly under Xvfb. This is the half of "follow the runbook" that needs no
# agent and no judgement — it just passes or fails on every PR.
#
# The visual/judgement half (screenshots + demo video) is handled separately by
# a Cursor Automation that launches a cloud agent on PR events; see
# docs/testing/automation-setup.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contract/**'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/contract/**'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Skip the ONNX/MiniLM model download — the smoke suite never needs the
      # real embedder, and the network fetch is slow + flaky in CI.
      NEEME_EMBEDDER: hash
      NEEME_EXTRACTOR: off
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary is present
        # Playwright's `_electron` launcher reads `electron/path.txt` to find the
        # binary. The cached pnpm store (actions/setup-node `cache: pnpm`) restores
        # electron's extracted `dist/` but DROPS `path.txt`, so electron's
        # install.js (isInstalled() needs both dist/version AND path.txt) thinks
        # it's not installed and tries to re-download — which is flaky in CI and
        # leaves path.txt unwritten, so `electron.launch` dies with
        # `ENOENT ... path.txt` (broken on every run since the Node 24 / v6 bump).
        # Fix: if the extracted binary is already cached, just restore path.txt so
        # install.js no-ops; only download when the binary is genuinely missing.
        # Then assert the launcher resolves so a regression fails here, loudly.
        run: |
          electron_dir="$(node -e "console.log(require('path').dirname(require.resolve('electron/package.json')))")"
          echo "electron package: $electron_dir"
          case "$(uname -s)" in
            Darwin) pp='Electron.app/Contents/MacOS/Electron' ;;
            *)      pp='electron' ;;
          esac
          if [ -e "$electron_dir/dist/$pp" ] && [ ! -f "$electron_dir/path.txt" ]; then
            printf '%s' "$pp" > "$electron_dir/path.txt"
            echo "restored path.txt -> $pp"
          fi
          node "$electron_dir/install.js"
          node -e "console.log('electron binary resolved at:', require('electron'))"

      - name: Install Electron/Chromium system libraries + Xvfb
        # Electron shares Chromium's shared-library set; `playwright install-deps
        # chromium` resolves the right apt packages across Ubuntu versions so we
        # don't hand-maintain a brittle libnss3/libgbm1/... list.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm --filter @nimi/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: pnpm --filter @nimi/desktop build

      - name: Run Electron E2E smoke (Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" pnpm --filter @nimi/desktop test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore
