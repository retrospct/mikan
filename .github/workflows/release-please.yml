name: Release Please

# Standard release-please flow. On every push to `main`, release-please maintains a
# single open "Release PR" that bumps the unified version (root + all workspaces via
# extra-files) and writes the changelog from Conventional Commits. Nothing ships from a
# normal merge — release-please only TAGS when it sees its own Release PR merged.
#
# Shipping is one deliberate step: merge the Release PR (the `/release` skill drives the
# review + merge). That merge is a push to `main`, so this workflow runs again, detects
# the merged release commit, tags `v<version>`, creates the GitHub Release, and the gated
# publish jobs build + publish for that tag.
#
# Why the builds are gated JOBS here (not separate `on: release` workflows): a release
# created with the default GITHUB_TOKEN does NOT trigger downstream `on: release` /
# `on: push: tags` workflows. Keying the builds off `release_created` in this same run is
# the reliable, no-PAT pattern.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual fallback (e.g. to re-run release-please)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: reads release-please-config.json + .release-please-manifest.json.
      # separate-pull-requests:true keeps the single Release PR on a component-ful branch
      # (release-please--branches--main--components--nimi) so createReleases matches the
      # configured component and actually cuts the tag; include-component-in-tag:false keeps
      # tags clean as v<version>. (Don't flip either back — see docs/RELEASING.md.)
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # A release was just cut (the Release PR merge produced a v<version> tag). Build +
  # publish the macOS desktop app for that tag.
  publish-desktop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Same gate: build (and, once store credentials exist, submit) the mobile app via EAS
  # for the freshly cut tag. Inert until EXPO_TOKEN + an EAS project are configured —
  # see release-mobile.yml.
  publish-mobile:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-mobile.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
