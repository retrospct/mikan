name: Release (build & publish)

# Reusable build + publish for the desktop app (single brand: Mikan). It does NOT
# trigger on merges to main — it's called by release-please.yml for the freshly cut
# tag (and is available via manual workflow_dispatch for a re-run).
#
# The version is NOT computed here: release-please bumps it in package.json before
# tagging, so the checked-out ref already carries the right version, which
# electron-builder reads. Brand is fixed to Mikan: electron-vite and
# electron-builder.config.cjs both default BRAND to `mikan`, so no env is needed.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/branch) to build — defaults to the selected branch
        type: string
        required: false

jobs:
  build-mac:
    name: Build & publish macOS (Mikan)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NEEME_EMBEDDER: hash
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Code-signing (Developer ID Application cert as base64-encoded .p12)
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # Notarization (App Store Connect API key — preferred over Apple ID + password)
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # ── Public client config, inlined at build time by electron-vite ──────────
      # Not confidential (a native PKCE app has no real client secret, and the
      # endpoint/appId/resource are visible in the auth URL anyway), but stored as
      # repo *Secrets* to keep them out of CI logs. They MUST be read from
      # `secrets.*` here — when referenced as `vars.*` while saved as Secrets, they
      # resolve to empty strings and the release ships with Logto + broker inert
      # (no sign-in, no sync). The privileged TURSO_PLATFORM_TOKEN stays on Vercel
      # (broker), never in the desktop build.
      MAIN_VITE_LOGTO_ENDPOINT: ${{ secrets.MAIN_VITE_LOGTO_ENDPOINT }}
      MAIN_VITE_LOGTO_APP_ID: ${{ secrets.MAIN_VITE_LOGTO_APP_ID }}
      MAIN_VITE_LOGTO_RESOURCE: ${{ secrets.MAIN_VITE_LOGTO_RESOURCE }}
      MAIN_VITE_NEEME_SYNC_BROKER_URL: ${{ secrets.MAIN_VITE_NEEME_SYNC_BROKER_URL }}
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_ID }}
      # Google "client secret" is non-confidential for a native app (it ships in
      # the binary regardless), but kept as a Secret to keep it out of CI logs.
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The tag release-please created (workflow_call) or a manual ref. Empty
          # on a bare dispatch → checks out the workflow's default branch.
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode App Store Connect API key
        # notarytool expects a file path, not inline content.
        # Decode the base64 secret to a temp file and point APPLE_API_KEY at it.
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > /tmp/apple_api_key.p8
          echo "APPLE_API_KEY=/tmp/apple_api_key.p8" >> $GITHUB_ENV

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & publish (macOS)
        # electron-builder publish reads CSC_LINK for signing and APPLE_* for notarytool.
        # GH_TOKEN uploads the DMG + latest-mac.yml to the GitHub Release (the one
        # release-please created for this tag), which electron-updater polls on
        # installed clients. BRAND selects the brand for both electron-vite and
        # electron-builder.config.cjs (which sets the publish owner/repo).
        run: pnpm --filter @mikan/desktop build:mac --publish always

  # Windows canary is deferred for the friends-and-family alpha.
  # Uncomment and add Azure Trusted Signing secrets when Windows is revisited.
  # build-win:
