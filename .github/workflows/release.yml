name: Release

# Triggered by a version tag: v0.x.y or v0.x.y-alpha.N
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build-mac:
    name: Build & publish macOS
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NEEME_EMBEDDER: hash
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Code-signing (Developer ID Application cert as base64-encoded .p12)
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # Notarization (App Store Connect API key — preferred over Apple ID + password)
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # ── Public client config, inlined at build time by electron-vite ──────────
      # These are NOT secrets: a native PKCE app has no client secret, and the
      # endpoint/appId/resource are visible in the auth URL anyway. They live as
      # repo/Environment *Variables* (Settings → Secrets and variables → Actions →
      # Variables). The privileged TURSO_PLATFORM_TOKEN stays on Vercel (broker),
      # never in the desktop build. Without these, a tagged release ships with
      # Logto + broker inert (no sign-in, no sync).
      MAIN_VITE_LOGTO_ENDPOINT: ${{ vars.MAIN_VITE_LOGTO_ENDPOINT }}
      MAIN_VITE_LOGTO_APP_ID: ${{ vars.MAIN_VITE_LOGTO_APP_ID }}
      MAIN_VITE_LOGTO_RESOURCE: ${{ vars.MAIN_VITE_LOGTO_RESOURCE }}
      MAIN_VITE_NEEME_SYNC_BROKER_URL: ${{ vars.MAIN_VITE_NEEME_SYNC_BROKER_URL }}
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
      # Google "client secret" is non-confidential for a native app (it ships in
      # the binary regardless), but kept as a Secret to keep it out of CI logs.
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode App Store Connect API key
        # notarytool expects a file path, not inline content.
        # Decode the base64 secret to a temp file and point APPLE_API_KEY at it.
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > /tmp/apple_api_key.p8
          echo "APPLE_API_KEY=/tmp/apple_api_key.p8" >> $GITHUB_ENV

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & publish (macOS)
        # electron-builder publish reads CSC_LINK for signing and APPLE_* for notarytool.
        # GH_TOKEN lets it upload artifacts to the GitHub Release created by the tag.
        # notarize in electron-builder.yml must be set to true once secrets are ready.
        run: pnpm --filter @nimi/desktop build:mac --publish always

  # Windows canary is deferred for the friends-and-family alpha.
  # Uncomment and add Azure Trusted Signing secrets when Windows is revisited.
  # build-win:
