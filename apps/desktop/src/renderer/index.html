<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Stamped with the active brand's product name at build (electron.vite.config.ts
         brandHtmlPlugin); kept in sync at runtime by BrandProvider. -->
    <title>Mikan</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         This is the PRODUCTION policy (offline-first, no remote origins):
         - script-src 'self'           — no inline/eval scripts (hard invariant).
         - style-src  'self'           — Tailwind ships as a same-origin linked
                                          stylesheet; React's style={{}} props apply
                                          via the CSSOM (exempt from CSP), and the
                                          accent tweak uses el.style.setProperty
                                          (also CSSOM), so no 'unsafe-inline' needed.
         - font-src   'self' data:     — fonts are bundled locally via @fontsource
                                          (see src/main.tsx); no Google Fonts. data:
                                          is needed because Vite inlines small font
                                          subsets (e.g. cyrillic) as data: URIs; the
                                          rest are same-origin asset files.
         - connect-src 'self'          — the renderer talks to the worker over IPC,
                                          not HTTP. The legacy FastAPI HTTP client
                                          (ApiStatus) is not mounted in the app.
         A defense-in-depth copy of this policy is also set as a response header in
         the main process (apps/desktop/src/main/index.ts), which a compromised
         renderer bundle cannot strip the way it could this meta tag.

         In DEV (electron-vite dev) this meta is rewritten by a serve-only Vite
         plugin (electron.vite.config.ts) to add style-src 'unsafe-inline' (Vite
         injects <style> tags for HMR) and connect-src http://localhost:8000 (the
         optional FastAPI round-trip smoke via ApiStatus). The built HTML keeps the
         strict policy below. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
