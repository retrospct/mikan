packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Hoist all deps to the root node_modules (flat, npm-style layout). pnpm-only
# setting; lives here rather than .npmrc so npm/npx don't warn on an unknown key.
shamefullyHoist: true

# Force a patched esbuild everywhere to avoid bundler incompatibilities.
overrides:
  esbuild@<0.25.0: '>=0.25.0'
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  tesseract.js: true
