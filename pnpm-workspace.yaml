packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Hoist all deps to the root node_modules (flat, npm-style layout). pnpm-only
# setting; lives here rather than .npmrc so npm/npx don't warn on an unknown key.
shamefullyHoist: true

# Only run install scripts for packages that actually need them.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - ffmpeg-static
  - onnxruntime-node
  - protobufjs
  - sharp
  - tesseract.js

# Force a patched esbuild everywhere to avoid bundler incompatibilities.
overrides:
  esbuild@<0.25.0: '>=0.25.0'
